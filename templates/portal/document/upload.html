{% extends "base.html" %}

{% block content %}
<div class="content-narrow">
  <h1>Upload a document</h1>
  <p class="lead">Add a supporting document for application #{{ application.reference }}.</p>
  <form method="post" action="{% url 'portal:upload_document' pk=application.pk %}" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Complete upload</button>
  </form>
  <a class="btn" href="{% url 'portal:application_detail' pk=application.pk %}">Back</a>
</div>
{% endblock %}
