{% extends "base.html" %}

{% block content %}
<div class="content-narrow">
  <div class="panel">
    <h1 style="text-align:center">Log in</h1>
    <form method="post" action="{% url 'portal:login' %}">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="message error">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}
        <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
      {% endfor %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p style="text-align:center">No account? <a class="help-link" href="{% url 'portal:signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
