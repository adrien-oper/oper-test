# Fly.io configuration for the borrower portal.
#
# The app slug below may already be taken on Fly's global namespace; if
# `fly launch`/`fly apps create` reports a name clash, pick another and update
# `app`, `ALLOWED_HOSTS` and `CSRF_TRUSTED_ORIGINS` to match. See DEPLOY.md.
app = "borrower-portal-demo"
primary_region = "ams"  # Amsterdam (EU)

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = "borrower-portal-demo.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://borrower-portal-demo.fly.dev"
  # SQLite database and uploaded media both live on the persistent volume
  # mounted at /data (see [[mounts]]).
  SQLITE_PATH = "/data/db.sqlite3"
  MEDIA_ROOT = "/data/media"
  # SECRET_KEY is injected at runtime via `fly secrets set SECRET_KEY=...`
  # and is intentionally NOT committed here. A startup system check refuses to
  # boot with DEBUG=False and the insecure default key.

# Migrations also run on container start (docker-entrypoint.sh). The release
# Machine does not mount the volume, so this release_command migrate hits a
# throwaway DB — it is kept because the spec calls for it and it is harmless
# (idempotent), but the entrypoint run is the one that actually migrates the
# volume-backed SQLite file. collectstatic is baked into the image at build.
[deploy]
  release_command = "python manage.py migrate --noinput"

[processes]
  web = "gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile -"
  worker = "python manage.py db_worker --no-startup-delay"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

# IMPORTANT SQLite constraint: a Fly volume attaches to exactly one Machine, and
# SQLite is a single-file single-host database. The volume is therefore mounted
# on the `web` process group only, and for a working demo BOTH gunicorn and the
# db_worker must run on the SAME single Machine that holds the volume. Run the
# worker co-located rather than as its own Machine:
#
#     fly scale count web=1 worker=0          # one web Machine holds the volume
#     # then start the durable worker on that same Machine, e.g. via a process
#     # manager in the image, OR rely on the worker process group ONLY if you
#     # move the database to LiteFS / Postgres (multi-Machine safe).
#
# For this stubbed-AI demo, document-analysis tasks are short; keeping a single
# web Machine (with the worker scaled to 0 unless you adopt LiteFS/Postgres)
# avoids two Machines fighting over one SQLite file. See DEPLOY.md.
[[mounts]]
  source = "data"
  destination = "/data"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
