[project]
name = "borrower-portal"
version = "0.1.0"
description = "A minimal white-label borrower portal with AI document analysis — Django 6 + HTMX."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django>=6.0",
  "django-fsm-2>=4.2",
  "django-tasks>=0.12",
  "django-tasks-db>=0.12",
  "django-htmx>=1.23",
  "django-widget-tweaks>=1.5",
  "anthropic>=0.104",
  "whitenoise>=6.11",
  "gunicorn>=23.0",
]

# Register the lightweight teatree overlay. teatree discovers it through this
# entry point; it is dev-only tooling and never imported by the portal runtime.
[project.entry-points."teatree.overlays"]
oper-test = "overlay.overlay:BorrowerPortalOverlay"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-django>=4.11",
  "pytest-cov>=7.0",
  "pytest-mock>=3.15",
  "ruff>=0.14",
  "ty>=0.0.1a14",
  "django-types>=0.22",
  "teatree",
  # teatree imports PyYAML in its eval loader but does not declare it; pin it
  # here so `t3` runs. Remove once teatree ships the dependency itself.
  "pyyaml>=6.0.3",
]
# End-to-end browser tests (Playwright). Deliberately kept OUT of both prod
# (`--no-dev` excludes all groups) and the default dev tooling, so it is only
# installed by the dedicated e2e CI job and developers running the suite.
e2e = [
  "pytest-playwright>=0.7",
]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true
lint.select = [ "ALL" ]
lint.ignore = [
  "CPY001", # missing-copyright-notice — not applicable
  # D1xx: missing docstrings — we prefer self-documenting code over docstrings
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203", # one-blank-line-before-class — conflicts with D211
  "D213", # multi-line-summary-second-line — conflicts with D212
  "DOC201",
  "DOC402",
  "DOC501",
  "INP001", # implicit-namespace-package
  "ISC002", # implicit-str-concat-in-sequence
  "RUF012", # mutable class attributes — Django models/Meta use these idiomatically
]
lint.extend-ignore = [
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",
]
# Auto-generated migration boilerplate: long generated lines and unannotated
# Migration classes are written by Django, not by hand. (RUF012 is already in
# the global ignore list.)
lint.per-file-ignores."**/migrations/*.py" = [
  "ANN",
  "ARG001",
  "E501",
]
# Django-generated entrypoint boilerplate — left as the framework writes it.
lint.per-file-ignores."manage.py" = [ "ANN201", "EM101", "PLC0415", "TRY003" ]
lint.per-file-ignores."**/settings.py" = [
  "S105", # hardcoded password string — dev-only default secret key, overridden in prod
  "E501",
]
lint.per-file-ignores."tests/**/*.py" = [
  "ANN",
  "ARG001",
  "ARG002",
  "PLR2004", # magic value in tests
  "PLR6301", # no-self-use (test methods)
  "S101",    # assert
  "S106",    # hardcoded password in test fixtures
]
# Browser-driven e2e specs follow the same test conventions as ``tests/``.
lint.per-file-ignores."e2e/**/*.py" = [
  "ANN",
  "ARG001",
  "ARG002",
  "PLR2004", # magic value in tests
  "S101",    # assert
  "S105",    # module-level password constant for the test login helper
  "S106",    # hardcoded password in test fixtures
]
lint.fixable = [ "ALL" ]
lint.unfixable = [ "F401", "F811" ]
lint.flake8-tidy-imports.banned-api."__future__.annotations" = { msg = "Use native 3.10+ syntax (X | Y) instead of from __future__ import annotations" }
lint.isort.split-on-trailing-comma = false
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 6
lint.preview = true

[tool.pytest.ini_options]
addopts = """
--color=yes --strict-config --strict-markers --verbose
--cov --cov-report=term-missing:skip-covered --cov-branch
--reuse-db
"""
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [ "test_*.py", "tests.py" ]
# Unit/integration run scans only `tests/`, so the browser-driven `e2e/` suite
# never enters the coverage-gated default run. The e2e CI job points pytest at
# `e2e` explicitly with `--no-cov`.
testpaths = [ "tests" ]
markers = [
  "e2e: browser-driven end-to-end journeys (run with `pytest e2e --no-cov`)",
]
filterwarnings = [
  "error",
  # WhiteNoise warns when STATIC_ROOT is empty before collectstatic; harmless in tests.
  "ignore:No directory at:UserWarning",
]

[tool.coverage.report]
fail_under = 95
precision = 1
show_missing = true
exclude_lines = [
  "if __name__",
  "if TYPE_CHECKING",
  "pragma: no cover",
]

[tool.coverage.run]
branch = true
source = [ "portal", "config", "overlay" ]
omit = [
  "*/migrations/*",
  "*/wsgi.py",
  "*/asgi.py",
  "manage.py",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "error"

# ty cannot resolve Django's metaclass-generated members — reverse-relation
# managers (``simulation.incomes``, ``user.simulations``), ``get_FOO_display()``,
# the ``save(*args, **kwargs)`` signature, the ``CharField(choices=…)`` overload
# in the migrations, the choices unions, and the Anthropic SDK content-block
# union. django-stubs would help but its mypy plugin is unsupported by ty. Only
# the model layer, the migrations, the analyzer, and the views that walk those
# reverse managers need the rules relaxed; everything else (admin, forms, the
# shared view helper, config) stays fully strict.
[[tool.ty.overrides]]
include = [
  "portal/models/**",
  "portal/migrations/**",
  "portal/ai/analyzer.py",
  "portal/views/application.py",
  "portal/views/dashboard.py",
  "portal/views/simulation.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"

[tool.uv]
managed = true
package = true

# teatree (the open-source agent CLI) is dev-only: it powers the `t3` overlay
# tooling and is never imported by the Django app. Pulled from the public repo.
[tool.uv.sources]
teatree = { git = "https://github.com/souliane/teatree" }

[build-system]
requires = [ "uv_build>=0.10,<0.12" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "overlay"
module-root = ""
